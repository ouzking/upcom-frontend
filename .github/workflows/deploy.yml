# Republication nocturne du site public.
#
# Le site Netlify est relié à ce dépôt : chaque push sur main est construit et déployé par
# Netlify (npm run build : pré-rendu des pages + sitemap.xml). Le back-office relance aussi
# la génération après chaque publication (Edge Function trigger-site-rebuild → build hook).
#
# Ce workflow couvre le cas restant : les articles PROGRAMMÉS, qui deviennent visibles à leur
# date sans aucune publication. Chaque nuit à 02:00 (heure de Dakar = UTC), il déclenche le
# build hook Netlify pour qu'ils obtiennent leur page pré-rendue et leur entrée dans le sitemap.
# Déclenchement manuel possible : onglet Actions → « Republication nocturne » → Run workflow.
#
# Configuration : secret GitHub NETLIFY_BUILD_HOOK_URL (Netlify → Site configuration →
# Build & deploy → Build hooks). Sans ce secret, le workflow se termine sans rien faire.

name: Republication nocturne

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Déclencher le build Netlify
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo "::notice::Secret NETLIFY_BUILD_HOOK_URL absent : republication ignorée."
            exit 0
          fi
          curl --fail --silent --show-error -X POST -d '{}' \
            "${NETLIFY_BUILD_HOOK_URL}?trigger_title=Republication+nocturne+(GitHub+Actions)"
          echo "Build Netlify déclenché."
